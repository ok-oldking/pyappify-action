name: PyAppify
description: Use PyAppify to package your python app
author: ok-oldking

inputs:
  app_version:
    description: Exact application tag to prepare before installing dependencies. Defaults to the workflow tag on tag builds, or latest stable otherwise. Requires PyAppify v1.2.4 or newer.
    required: false

  version:
    description: The tag version of pyappify to use. Defaults to the latest tag. Strongly recommended to set to ensure consistancy.
    required: false
  
  use_release:
    description: The github release version to use. Saves time for re-compiling and signing
    required: false
  
  build_exe_only:
    description: if enabled, will only build the build the exe and you can use the output exe-path to sign it. and the PyAppify action again to use the signed exe.
    required: false
    type: boolean
    default: false

  build_setup:
    description: Build the online and per-profile setup executables. At least one of build_setup or package_zip must be true, except in build_exe_only mode.
    required: false
    type: boolean
    default: true

  add_version_name:
    description: if enabled, will add the app version (the pushed git tag, leading v removed) to the setup exe names, e.g. xxx-setup-1.1.0.exe or xxx-setup-1.1.0-beta.1.exe
    required: false
    type: boolean
    default: false

  package_zip:
    description: if enabled, will also create a zip package per profile (root folder is the app name) containing the prepared python env and app, without the tauri exe or installer, plus a <app name>.cmd that runs the python script directly
    required: false
    type: boolean
    default: false

  package_zip_format:
    description: archive format of the package_zip output, '7z' (solid LZMA2, much smaller, needs Windows 11 23H2+ or 7-Zip to open) or 'zip'
    required: false
    default: '7z'

outputs:
  dist-path:
    description: The path to the directory containing the zipped application bundles.

  pyappify-assets:
    description: The list of files to be released.

  exe-path:
    description: The tauri exe path

  exe-folder:
    description: The tauri exe's folder location

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: package
  color: blue
