name: PyAppify
description: Use PyAppify to package your python app
author: ok-oldking

inputs:
  app_version:
    description: Exact application tag to prepare before installing dependencies. Defaults to the workflow tag on tag builds, or latest stable otherwise. Requires PyAppify v1.2.4 or newer.
    required: false

  use_git_url:
    description: Clone the app from the profiles' git_url. Set to false, or leave git_url out of pyappify.yml, to package the app's local files instead (the checkout's tracked and untracked files minus ignored ones, or every file outside a git repository). Needs a PyAppify launcher newer than v1.2.7. Without a git repository there are no updates, the online setup is skipped and archives get no updater cmd; app_version (or the workflow tag) names the packaged version.
    required: false
    type: boolean
    default: true

  version:
    description: The tag version of pyappify to use. Defaults to the latest tag. Strongly recommended to set to ensure consistancy.
    required: false
  
  build_exe_only:
    description: if enabled, will only build the build the exe and you can use the output exe-path to sign it. and the PyAppify action again to use the signed exe.
    required: false
    type: boolean
    default: false

  build_setup:
    description: Build the online and per-profile setup executables. At least one of build_setup or package_zip must be true, except in build_exe_only mode.
    required: false
    type: boolean
    default: true

  add_version_name:
    description: if enabled, will add the app version (the pushed git tag without its name prefix and leading v) to the setup exe and archive names, e.g. xxx-setup-1.1.0.exe or xxx-setup-1.1.0-beta.1.exe. Without a pushed tag it is the newest version tag reachable from the checkout, else the checkout's short commit hash (with a warning) instead of failing.
    required: false
    type: boolean
    default: false

  package_zip:
    description: if enabled, will also create a zip package per profile (root folder is the app name) containing the prepared python env and app, without the tauri exe or installer, plus a <app name>.cmd that runs the python script directly
    required: false
    type: boolean
    default: false

  package_zip_format:
    description: archive format of the package_zip output, '7z' (solid LZMA2, much smaller, needs Windows 11 23H2+ or 7-Zip to open) or 'zip'
    required: false
    default: '7z'

  package_zip_updater:
    description: if enabled, each package_zip archive also gets a <app name>-updater.cmd that opens the pyappify update window (pick a version, read its notes, choose the pip mirror, update and restart the app). Needs the app to depend on pyappify[standalone] 1.0.20 or newer (Python 3.10+); otherwise it is skipped with a warning
    required: false
    type: boolean
    default: true

outputs:
  dist-path:
    description: The path to the directory containing the zipped application bundles.

  pyappify-assets:
    description: The list of files to be released.

  exe-path:
    description: The tauri exe path

  exe-folder:
    description: The tauri exe's folder location

  release-notes:
    description: Markdown notes for the packaged version. The version's CHANGELOG.md entry (merged with the prereleases since the previous release) when it has one, otherwise the commit subjects since the previous version. Without version tags, the 30 most recent commits as '- <short hash> <subject>'.

  release-notes-path:
    description: Path of pyappify_release_notes.md holding release-notes, for the release step's body_path. Written outside pyappify_dist so it is not uploaded as an asset.

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: package
  color: blue
